<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, orientation=portrait">
    <title>Amazon Shift Timer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background-color: black;
            font-family: 'Lucida Console', 'Courier New', monospace;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #1f1f1f; /* 60% brightness of original #333333 notes color */
        }
        #current-time {
            font-size: 20vw;
            font-weight: bold;
            line-height: 1.1;
            margin-bottom: 8vh;
            color: #151515; /* 60% brightness of original #222222 */
        }
        #countdown-text {
            font-size: 12vw;
            font-weight: 700;
            margin-bottom: 8vh;
            color: #151515; /* 60% brightness of original #222222 */
        }
        #display-note {
            font-size: 6vw;
            font-weight: 600;
            max-width: 90%;
            padding: 0 10px;
            white-space: pre-wrap;
            color: #1f1f1f; /* 60% brightness of original #333333 */
        }
        .red-flash {
            color: #331111 !important; /* Original red brightness restored */
        }
        .note-extra::before {
            content: "\A";
            white-space: pre;
        }
        @media (orientation: landscape) {
            body::before {
                content: 'Portrait only';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: black;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10vw;
                z-index: 9999;
            }
        }
    </style>
</head>
<body>
    <div id="current-time">--:--</div>
    <div id="countdown-text">--:--</div>
    <div id="display-note">Loading Schedule...</div>

    <script>
        // Amazon shift schedule example - adjust times/notes as needed
        const schedule = [
            { start: "07:00", end: "07:30", note: "Punch In 7:25-7:30", noteExtra: "7:35 latest", noteUntil: "07:35", colorClass: "red-flash" },
            { start: "15:45", end: "16:15", note: "Lunch End\nBack to Line", noteExtra: "", noteUntil: "16:15" },
            { start: "23:30", end: "23:45", note: "Punch Out", noteExtra: "", noteUntil: "23:45" }
            // Add more shifts here
        ];

        let countdownInterval;
        let flashInterval;

        function padZero(num) {
            return num.toString().padStart(2, '0');
        }

        function formatTime(date) {
            return padZero(date.getHours()) + ':' + padZero(date.getMinutes());
        }

        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        function minutesToTime(totalMinutes) {
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            if (hours >= 1) {
                return padZero(hours) + ':' + padZero(minutes);
            } else {
                return padZero(minutes);
            }
        }

        function findCurrentShift() {
            const now = new Date();
            const currentTime = timeToMinutes(formatTime(now));
            const today = now.toDateString();

            for (let shift of schedule) {
                const startMin = timeToMinutes(shift.start);
                const endMin = timeToMinutes(shift.end);
                const untilMin = timeToMinutes(shift.noteUntil || shift.end);

                if (currentTime >= startMin && currentTime <= untilMin) {
                    const remainingMin = untilMin - currentTime;
                    return {
                        note: shift.note + (shift.noteExtra ? '\n' + shift.noteExtra : ''),
                        remainingMin,
                        colorClass: shift.colorClass || ''
                    };
                }
            }
            return { note: 'No active shift', remainingMin: 0, colorClass: '' };
        }

        function updateDisplay() {
            const now = new Date();
            document.getElementById('current-time').textContent = formatTime(now);

            const current = findCurrentShift();
            const display = document.getElementById('display-note');
            display.textContent = current.note;
            display.className = current.colorClass;

            // Countdown logic
            if (current.remainingMin > 0) {
                const countdownDiv = document.getElementById('countdown-text');
                countdownDiv.textContent = minutesToTime(current.remainingMin);
                countdownDiv.style.display = 'block';

                // Flash red near end (e.g., <5 min)
                if (current.remainingMin <= 5 && current.colorClass === 'red-flash') {
                    if (flashInterval) clearInterval(flashInterval);
                    let flashState = true;
                    flashInterval = setInterval(() => {
                        display.style.opacity = flashState ? '1' : '0.3';
                        flashState = !flashState;
                    }, 500);
                }
            } else {
                document.getElementById('countdown-text').style.display = 'none';
                if (flashInterval) {
                    clearInterval(flashInterval);
                    display.style.opacity = '1';
                }
            }
        }

        // Update every minute
        updateDisplay();
        setInterval(updateDisplay, 60000);

        // Real-time second updates for clock/countdown
        setInterval(() => {
            const now = new Date();
            if (now.getSeconds() === 0) updateDisplay();
        }, 1000);

        // Handle orientation change (reinforce portrait)
        window.addEventListener('orientationchange', () => {
            setTimeout(updateDisplay, 500);
        });
    </script>
</body>
</html>
