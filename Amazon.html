<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Amazon Shift Timer</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100dvh; /* Use dynamic viewport height to truly fill screen on mobile */
        overflow: hidden;
        background-color: black;
    }
    body {
        color: #555; /* Dimmed gray text to look like an always-on display */
        font-family: 'Lucida Console', monospace;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    #current-time {
        font-size: 20vw;
        font-weight: bold;
        line-height: 1.1;
        margin-bottom: 8vh;
        color: #777; /* Slightly brighter but still dim */
    }
    #countdown-text {
        font-size: 8vw;
        font-weight: normal;
        margin-bottom: 8vh;
        color: #555;
    }
    #display-note {
        font-size: 5vw;
        color: #444; /* Dimmest text */
        max-width: 90%;
        padding: 0 10px;
    }
    .red-flash {
        color: #aa3333 !important; /* Dimmed red instead of full bright */
    }
</style>
</head>
<body>
    <div id="current-time">--:--</div>
    <div id="countdown-text">--:--</div>
    <div id="display-note">Loading Schedule...</div>

<script>
    const schedule = [
        { start: "07:00", end: "07:30", note: "Tap 7:25-7:30 (7:35 latest)", noteUntil: "07:40" },
        { start: "07:40", end: "10:00", note: "10 minute break by 10am", noteUntil: "10:10" },
        { start: "10:10", end: "10:56", note: "Last scan 10:56-10:59", noteUntil: "11:05" },
        { start: "11:05", end: "13:30", note: "10 minute break by 1:30", noteUntil: "13:40" },
        { start: "13:40", end: "14:26", note: "Last scan 2:26-2:29 (tap 2:30-2:32)", noteUntil: "14:35" },
        { start: "14:35", end: "15:00", note: "Return to work", noteUntil: "15:05" },
        { start: "15:05", end: "17:00", note: "10 minute break by 5:00pm", noteUntil: "17:10" },
        { start: "17:10", end: "17:56", note: "Last scan 5:56-5:59 (tap 5:57-6:00)", noteUntil: "18:05" }
    ];

    const currentTimeElement = document.getElementById('current-time');
    const countdownElement = document.getElementById('countdown-text');
    const noteElement = document.getElementById('display-note');

    function pad(num) {
        return num.toString().padStart(2, '0');
    }

    function updateCurrentTime() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes();

        if (hours > 12) {
            hours -= 12;
        } else if (hours === 0) {
            hours = 12;
        }

        currentTimeElement.textContent = `${hours}:${pad(minutes)}`;
    }

    function createTodayTime(timeString) {
        const [hours, minutes] = timeString.split(':').map(Number);
        const date = new Date();
        date.setHours(hours, minutes, 0, 0);
        return date;
    }

    function formatCountdown(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        if (hours > 0) {
            return `${hours}:${pad(minutes)}:${pad(seconds)}`;
        } else {
            return `${minutes}:${pad(seconds)}`;
        }
    }

    function updateDisplay() {
        const now = new Date();
        updateCurrentTime();

        let currentSegment = null;

        for (const segment of schedule) {
            const startTime = createTodayTime(segment.start);
            const noteUntilTime = createTodayTime(segment.noteUntil);

            if (now >= startTime && now < noteUntilTime) {
                currentSegment = segment;
                break;
            }
        }

        if (currentSegment) {
            const countdownTargetTime = createTodayTime(currentSegment.end);
            const noteUntilTime = createTodayTime(currentSegment.noteUntil);
            noteElement.textContent = currentSegment.note;

            if (now < countdownTargetTime) {
                const distance = countdownTargetTime - now;
                countdownElement.textContent = formatCountdown(distance);
                countdownElement.classList.remove('red-flash');

                if (distance < 5 * 60 * 1000) {
                    countdownElement.classList.add('red-flash');
                }
            } else if (now >= countdownTargetTime && now < noteUntilTime) {
                countdownElement.textContent = `-`;
                countdownElement.classList.add('red-flash');
            }
        } else {
            const firstStart = createTodayTime("07:00");

            if (now < firstStart) {
                countdownElement.textContent = "";
                noteElement.textContent = "";
            } else {
                countdownElement.textContent = "";
                noteElement.textContent = "";
            }
            countdownElement.classList.remove('red-flash');
        }
    }

    function startTimer() {
        updateDisplay();
        setInterval(updateDisplay, 1000); // 1 second is enough for AOD feel
    }

    window.onload = startTimer;
</script>
</body>
</html>
