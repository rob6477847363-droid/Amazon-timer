<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Amazon Shift Timer</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100dvh;
        overflow: hidden;
        background-color: black;
    }
    body {
        color: #444444; /* notes default */
        font-family: 'Lucida Console', monospace;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    #current-time {
        font-size: 20vw;
        font-weight: bold;
        line-height: 1.1;
        margin-bottom: 8vh;
        color: #222222; /* darker clock */
    }
    #countdown-text {
        font-size: 12vw;   /* 20% bigger than 10vw */
        font-weight: 700;
        margin-bottom: 8vh;
        color: #222222;    /* darker timer */
    }
    #display-note {
        font-size: 6vw;
        font-weight: 600;
        max-width: 90%;
        padding: 0 10px;
        white-space: pre-wrap;
        /* stays #444 */
    }
    .red-flash {
        color: #331111 !important;
    }
    .note-extra::before {
        content: "\A";
        white-space: pre;
    }
</style>
</head>
<body>
    <div id="current-time">--:--</div>
    <div id="countdown-text">--:--</div>
    <div id="display-note">Loading Schedule...</div>

<script>
    const schedule = [
        { 
            start: "07:00",
            end: "07:30",
            note: "Punch In 7:25-7:30",
            noteExtra: "7:35 latest",
            noteUntil: "07:40"
        },
        { 
            start: "07:40",
            end: "10:56",
            note: "Last scan 10:56-10:59",
            noteExtra: "",
            noteUntil: "11:05"
        },
        { 
            start: "11:00",
            end: "11:30",
            note: "Return to work",
            noteExtra: "",
            noteUntil: "11:35"
        },
        { 
            start: "11:35",
            end: "14:26",
            note: "Last scan 2:26-2:29",
            noteExtra: "Punch out 2:30-2:32",
            noteUntil: "14:35"
        },
        { 
            start: "14:35",
            end: "15:00",
            note: "Return to work",
            noteExtra: "",
            noteUntil: "15:05"
        },
        { 
            start: "15:05",
            end: "17:56",
            note: "Last scan 5:56-5:59",
            noteExtra: "Punch out 5:57-6:00",
            noteUntil: "18:05"
        }
    ];

    const currentTimeElement = document.getElementById('current-time');
    const countdownElement = document.getElementById('countdown-text');
    const noteElement = document.getElementById('display-note');

    function pad(num) {
        return num.toString().padStart(2, '0');
    }

    function updateCurrentTime() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes();

        if (hours > 12) {
            hours -= 12;
        } else if (hours === 0) {
            hours = 12;
        }

        currentTimeElement.textContent = `${hours}:${pad(minutes)}`;
    }

    function createTodayTime(timeString) {
        const [hours, minutes] = timeString.split(':').map(Number);
        const date = new Date();
        date.setHours(hours, minutes, 0, 0);
        return date;
    }

    // >= 1:40:00 -> H:MM:SS, otherwise totalMinutes:SS
    function formatCountdown(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        if (totalSeconds >= 6000) { // 1h 40m
            return `${hours}:${pad(minutes)}:${pad(seconds)}`;
        } else {
            const totalMinutes = Math.floor(totalSeconds / 60);
            return `${totalMinutes}:${pad(seconds)}`;
        }
    }

    function renderNote(segment) {
        if (segment.noteExtra && segment.noteExtra.trim() !== "") {
            noteElement.innerHTML = `${segment.note}<span class="note-extra">${segment.noteExtra}</span>`;
        } else {
            noteElement.textContent = segment.note;
        }
    }

    function updateDisplay() {
        const now = new Date();
        updateCurrentTime();

        let currentSegment = null;

        for (const segment of schedule) {
            const startTime = createTodayTime(segment.start);
            const noteUntilTime = createTodayTime(segment.noteUntil);

            if (now >= startTime && now < noteUntilTime) {
                currentSegment = segment;
                break;
            }
        }

        if (currentSegment) {
            const countdownTargetTime = createTodayTime(currentSegment.end);
            const noteUntilTime = createTodayTime(currentSegment.noteUntil);
            renderNote(currentSegment);

            if (now < countdownTargetTime) {
                const distance = countdownTargetTime - now;
                countdownElement.textContent = formatCountdown(distance);
                countdownElement.classList.remove('red-flash');

                if (distance < 5 * 60 * 1000) {
                    countdownElement.classList.add('red-flash');
                }
            } else if (now >= countdownTargetTime && now < noteUntilTime) {
                countdownElement.textContent = `-`;
                countdownElement.classList.add('red-flash');
            }
        } else {
            const firstStart = createTodayTime("07:00");

            if (now < firstStart) {
                countdownElement.textContent = "";
                noteElement.textContent = "";
            } else {
                countdownElement.textContent = "";
                noteElement.textContent = "";
            }
            countdownElement.classList.remove('red-flash');
        }
    }

    function startTimer() {
        updateDisplay();
        setInterval(updateDisplay, 1000);
    }

    window.onload = startTimer;
</script>

</body>
</html>
